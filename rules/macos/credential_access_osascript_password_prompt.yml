id: e994ab94-3f35-57f8-acf3-ee802ca6e2b1_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies osascript showing a dialog with a hidden answer field, a common way for malware to phish the user's login password.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Password Prompt Displayed via Osascript
  note: |
    ## Triage and analysis

    ### Investigating Password Prompt Displayed via Osascript

    ### Possible investigation steps

    - Identify the parent process and how it got on the Mac.
    - Reset the user's password if they entered it.

    ### False positive analysis

    - Some IT scripts ask for the password. Exclude them by `process.parent.executable`.
  query: |
    process where host.os.type == "macos" and event.type == "start" and
      process.name == "osascript" and process.command_line like~ "*display dialog*" and
      process.command_line like~ ("*hidden answer*", "*password*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: e994ab94-3f35-57f8-acf3-ee802ca6e2b1
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1056
          name: Input Capture
          reference: "https://attack.mitre.org/techniques/T1056/"
          subtechnique:
            - id: T1056.002
              name: GUI Input Capture
              reference: "https://attack.mitre.org/techniques/T1056/002/"
  timestamp_override: event.ingested
  type: eql
  version: 1
