id: "56d72ed5-f73c-5245-9d27-71d9ef79f6f4_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies the security tool dumping a keychain, which writes all the user's saved passwords out.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Keychain Dumped via Security
  note: |
    ## Triage and analysis

    ### Investigating Keychain Dumped via Security

    ### Possible investigation steps

    - Find where the output went.
    - Rotate the passwords stored in the keychain.

    ### False positive analysis

    - None expected.
  query: |
    process where host.os.type == "macos" and event.type == "start" and
      process.name == "security" and process.args == "dump-keychain"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: "56d72ed5-f73c-5245-9d27-71d9ef79f6f4"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.001
              name: Keychain
              reference: "https://attack.mitre.org/techniques/T1555/001/"
  timestamp_override: event.ingested
  type: eql
  version: 1
