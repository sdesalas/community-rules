id: "545f8ca4-62c7-4fd0-8a88-ca40e0b3c3ed_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies xattr removing the quarantine attribute from files. Removing it lets a downloaded file run without a Gatekeeper prompt.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Quarantine Attribute Removed via xattr
  query: |
    process where host.os.type == "macos" and event.type == "start" and process.name == "xattr" and
      (process.args in ("-c", "-cr", "-rc") or (process.args == "-d" and process.args == "com.apple.quarantine"))
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "545f8ca4-62c7-4fd0-8a88-ca40e0b3c3ed"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Defense Evasion"
    - "Data Source: Elastic Defend"
    - "Source: Community"
  threat:
    - framework: "MITRE ATT&CK"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1553
          name: Subvert Trust Controls
          reference: "https://attack.mitre.org/techniques/T1553/"
          subtechnique:
            - id: T1553.001
              name: Gatekeeper Bypass
              reference: "https://attack.mitre.org/techniques/T1553/001/"
  timestamp_override: event.ingested
  type: eql
  version: 1
