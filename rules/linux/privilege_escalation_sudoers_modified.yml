id: "8de66880-24ef-5e17-a4c6-c2b5965d813f_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies a change to /etc/sudoers or a file in /etc/sudoers.d by a process other than visudo or a configuration tool.
  from: now-9m
  index:
    - "logs-endpoint.events.file*"
  language: eql
  license: Elastic License v2
  name: Sudoers File Modified
  note: |
    ## Triage and analysis

    ### Investigating Sudoers File Modified

    ### Possible investigation steps

    - Review the new sudo rules.
    - Identify the process and user that changed the file.

    ### False positive analysis

    - Install scripts that add a sudo rule. Confirm with the owner.
  query: |
    file where host.os.type == "linux" and event.action in ("creation", "modification", "rename") and
      file.path like ("/etc/sudoers", "/etc/sudoers.d/*") and
      not process.name in ("visudo", "dpkg", "rpm", "yum", "dnf", "ansible-playbook", "puppet", "chef-client", "salt-minion")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
    - package: auditd_manager
      version: ">=1.18.0"
  risk_score: 73
  rule_id: "8de66880-24ef-5e17-a4c6-c2b5965d813f"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: Linux"
    - "Use Case: Threat Detection"
    - "Tactic: Privilege Escalation"
    - "Data Source: Elastic Defend"
    - "Data Source: Auditd Manager"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0004
        name: Privilege Escalation
        reference: "https://attack.mitre.org/tactics/TA0004/"
      technique:
        - id: T1548
          name: Abuse Elevation Control Mechanism
          reference: "https://attack.mitre.org/techniques/T1548/"
          subtechnique:
            - id: T1548.003
              name: Sudo and Sudo Caching
              reference: "https://attack.mitre.org/techniques/T1548/003/"
  timestamp_override: event.ingested
  type: eql
  version: 1
