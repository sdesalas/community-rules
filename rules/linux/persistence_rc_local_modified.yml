id: "90b87ff9-de60-5650-a0db-2212e15405fd_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies a change to /etc/rc.local, which runs at boot on many distributions.
  from: now-9m
  index:
    - "logs-endpoint.events.file*"
  language: eql
  license: Elastic License v2
  name: Rc.local File Modified
  note: |
    ## Triage and analysis

    ### Investigating Rc.local File Modified

    ### Possible investigation steps

    - Review the file's new lines.
    - Identify the process that changed it.

    ### False positive analysis

    - Older systems still use rc.local. Confirm with the owner.
  query: |
    file where host.os.type == "linux" and event.action in ("creation", "modification", "rename") and
      file.path in ("/etc/rc.local", "/etc/rc.d/rc.local")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
    - package: auditd_manager
      version: ">=1.18.0"
  risk_score: 47
  rule_id: "90b87ff9-de60-5650-a0db-2212e15405fd"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Linux"
    - "Use Case: Threat Detection"
    - "Tactic: Persistence"
    - "Data Source: Elastic Defend"
    - "Data Source: Auditd Manager"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
      technique:
        - id: T1037
          name: Boot or Logon Initialization Scripts
          reference: "https://attack.mitre.org/techniques/T1037/"
          subtechnique:
            - id: T1037.004
              name: RC Scripts
              reference: "https://attack.mitre.org/techniques/T1037/004/"
  timestamp_override: event.ingested
  type: eql
  version: 1
