id: b2ef8643-6135-4af9-a1fd-a87e4e5ab292_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies reads of process memory through the proc filesystem. Attackers dump the memory of a process to extract credentials or encryption keys.
  from: now-9m
  index:
    - "auditbeat-*"
    - "logs-auditd_manager.auditd-*"
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Manual Memory Dumping via Proc Filesystem
  query: |
    process where host.os.type == "linux" and event.type == "start" and
      event.action in ("exec", "exec_event", "start", "ProcessRollup2", "executed", "process_started") and
      process.name in ("cat", "grep", "tail", "less", "more", "egrep", "fgrep") and
      process.command_line like "/proc/*/mem"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
    - package: auditd_manager
      version: ">=1.18.0"
  risk_score: 73
  rule_id: b2ef8643-6135-4af9-a1fd-a87e4e5ab292
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: Linux"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Data Source: Auditd Manager"
    - "Source: Community"
  threat:
    - framework: "MITRE ATT&CK"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1003
          name: OS Credential Dumping
          reference: "https://attack.mitre.org/techniques/T1003/"
          subtechnique:
            - id: T1003.007
              name: Proc Filesystem
              reference: "https://attack.mitre.org/techniques/T1003/007/"
  timestamp_override: event.ingested
  type: eql
  version: 1
