id: "6583d25f-d734-5f16-a4fb-dbbf17f0dfb0_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies a process whose command line holds well-known Mimikatz commands, whatever the binary is named.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: Mimikatz Command Line Arguments
  note: |
    ## Triage and analysis

    ### Investigating Mimikatz Command Line Arguments

    ### Possible investigation steps

    - Isolate the host.
    - Reset the credentials of every account that logged on to it.

    ### False positive analysis

    - Red team exercises. Confirm with the security team.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.command_line : ("*sekurlsa::*", "*lsadump::*", "*kerberos::golden*", "*privilege::debug*", "*crypto::capi*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 99
  rule_id: "6583d25f-d734-5f16-a4fb-dbbf17f0dfb0"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: critical
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1003
          name: OS Credential Dumping
          reference: "https://attack.mitre.org/techniques/T1003/"
  timestamp_override: event.ingested
  type: eql
  version: 1
