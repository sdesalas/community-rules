id: "32e56ce8-3a15-5bed-a891-a0be4a1c77fc_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies wmic creating a process on another host with process call create and /node.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: Remote Process Created via WMIC
  note: |
    ## Triage and analysis

    ### Investigating Remote Process Created via WMIC

    ### Possible investigation steps

    - Identify the target host and the command run on it.
    - Review the account used.

    ### False positive analysis

    - Legacy admin scripts. Exclude them by `process.parent.executable`.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.name : "wmic.exe" and process.command_line : "*/node:*" and
      process.command_line : "*process*" and process.command_line : "*call*" and process.command_line : "*create*"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "32e56ce8-3a15-5bed-a891-a0be4a1c77fc"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Lateral Movement"
    - "Tactic: Execution"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0008
        name: Lateral Movement
        reference: "https://attack.mitre.org/tactics/TA0008/"
      technique:
        - id: T1021
          name: Remote Services
          reference: "https://attack.mitre.org/techniques/T1021/"
    - framework: MITRE ATT&CK
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
      technique:
        - id: T1047
          name: Windows Management Instrumentation
          reference: "https://attack.mitre.org/techniques/T1047/"
  timestamp_override: event.ingested
  type: eql
  version: 1
