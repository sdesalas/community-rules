id: e27c1bec-f327-5435-bc9b-8073678725f9_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies reg.exe saving the SAM, SECURITY or SYSTEM hive to a file. Together these hives hold local password hashes and cached domain credentials.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: SAM or SECURITY Registry Hive Saved via Reg
  note: |
    ## Triage and analysis

    ### Investigating SAM or SECURITY Registry Hive Saved via Reg

    ### Possible investigation steps

    - Find and remove the saved hive files.
    - Reset local administrator passwords on the host.

    ### False positive analysis

    - Some backup tools save hives. Exclude them by `process.parent.executable`.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.name : "reg.exe" and process.args : ("save", "export") and
      process.args : ("HKLM\\SAM", "HKLM\\SECURITY", "HKLM\\SYSTEM", "HKEY_LOCAL_MACHINE\\SAM", "HKEY_LOCAL_MACHINE\\SECURITY", "HKEY_LOCAL_MACHINE\\SYSTEM")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: e27c1bec-f327-5435-bc9b-8073678725f9
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1003
          name: OS Credential Dumping
          reference: "https://attack.mitre.org/techniques/T1003/"
          subtechnique:
            - id: T1003.002
              name: Security Account Manager
              reference: "https://attack.mitre.org/techniques/T1003/002/"
  timestamp_override: event.ingested
  type: eql
  version: 1
