id: "5220cca7-cff9-5d97-a0b0-91e4697fbe5d_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies ntdsutil creating an install-from-media copy of the Active Directory database, which holds the password hashes of every domain account.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: NTDS Database Copied via Ntdsutil
  note: |
    ## Triage and analysis

    ### Investigating NTDS Database Copied via Ntdsutil

    ### Possible investigation steps

    - Confirm with the domain admins whether this was planned.
    - Plan a reset of the krbtgt account if it was not.

    ### False positive analysis

    - Planned domain controller builds use IFM media. Confirm with the domain admins.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.name : "ntdsutil.exe" and process.command_line : "*ifm*" and process.command_line : "*create*"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 99
  rule_id: "5220cca7-cff9-5d97-a0b0-91e4697fbe5d"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: critical
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1003
          name: OS Credential Dumping
          reference: "https://attack.mitre.org/techniques/T1003/"
          subtechnique:
            - id: T1003.003
              name: NTDS
              reference: "https://attack.mitre.org/techniques/T1003/003/"
  timestamp_override: event.ingested
  type: eql
  version: 1
