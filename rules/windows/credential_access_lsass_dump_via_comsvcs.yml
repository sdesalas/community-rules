id: b8d30470-e580-5ed3-8b82-62abc29df0d5_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies rundll32 calling the MiniDump export of comsvcs.dll, a built-in way to dump LSASS memory and read credentials from it.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: LSASS Memory Dumped via Comsvcs MiniDump
  note: |
    ## Triage and analysis

    ### Investigating LSASS Memory Dumped via Comsvcs MiniDump

    ### Possible investigation steps

    - Find the dump file named in `process.command_line` and remove it.
    - Reset the passwords of accounts logged on to the host.

    ### False positive analysis

    - None expected.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.name : "rundll32.exe" and process.command_line : "*comsvcs*" and
      process.command_line : ("*MiniDump*", "*#24*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: b8d30470-e580-5ed3-8b82-62abc29df0d5
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1003
          name: OS Credential Dumping
          reference: "https://attack.mitre.org/techniques/T1003/"
          subtechnique:
            - id: T1003.001
              name: LSASS Memory
              reference: "https://attack.mitre.org/techniques/T1003/001/"
  timestamp_override: event.ingested
  type: eql
  version: 1
