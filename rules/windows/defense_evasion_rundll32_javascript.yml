id: b2c9145b-7f66-5a1c-9167-b6b56a6aad5c_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies rundll32 running inline JavaScript through mshtml, a way to run script without a script host process.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: JavaScript Run via Rundll32
  note: |
    ## Triage and analysis

    ### Investigating JavaScript Run via Rundll32

    ### Possible investigation steps

    - Review the script in the command line.
    - Check what started rundll32.

    ### False positive analysis

    - None expected.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.name : "rundll32.exe" and process.command_line : ("*javascript:*", "*mshtml*RunHTMLApplication*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: b2c9145b-7f66-5a1c-9167-b6b56a6aad5c
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Defense Evasion"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1218
          name: System Binary Proxy Execution
          reference: "https://attack.mitre.org/techniques/T1218/"
          subtechnique:
            - id: T1218.011
              name: Rundll32
              reference: "https://attack.mitre.org/techniques/T1218/011/"
  timestamp_override: event.ingested
  type: eql
  version: 1
