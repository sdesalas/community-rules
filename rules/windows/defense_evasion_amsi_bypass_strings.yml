id: c222a98a-fa97-537b-9b82-1bb1c68759a1_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies PowerShell command lines with well-known strings used to turn off the Antimalware Scan Interface, so later scripts are not scanned.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: AMSI Bypass Strings in PowerShell Command Line
  note: |
    ## Triage and analysis

    ### Investigating AMSI Bypass Strings in PowerShell Command Line

    ### Possible investigation steps

    - Review the full script and what it loaded next.
    - Check the parent process and how the script arrived.

    ### False positive analysis

    - Security tooling tests. Exclude them by `user.name`.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.name : ("powershell.exe", "pwsh.exe") and
      process.command_line : ("*AmsiUtils*", "*amsiInitFailed*", "*AmsiScanBuffer*", "*amsi.dll*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: c222a98a-fa97-537b-9b82-1bb1c68759a1
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Defense Evasion"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1562
          name: Impair Defenses
          reference: "https://attack.mitre.org/techniques/T1562/"
          subtechnique:
            - id: T1562.001
              name: Disable or Modify Tools
              reference: "https://attack.mitre.org/techniques/T1562/001/"
  timestamp_override: event.ingested
  type: eql
  version: 1
