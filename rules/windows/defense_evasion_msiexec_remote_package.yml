id: "291c0acc-f042-577c-9c35-b7cb05c710a8_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies msiexec installing a package straight from a URL, quietly. This runs the package's custom actions without a file the user opened.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: Remote MSI Package Installed via Msiexec
  note: |
    ## Triage and analysis

    ### Investigating Remote MSI Package Installed via Msiexec

    ### Possible investigation steps

    - Download the package from a safe host and review it.
    - Review what the install changed on the host.

    ### False positive analysis

    - Software deployment tools. Exclude them by `process.parent.executable`.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.name : "msiexec.exe" and process.args : ("/i", "-i", "/package", "-package") and
      process.args : ("/q", "/qn", "-q", "-qn", "/quiet") and process.command_line : "*http*"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "291c0acc-f042-577c-9c35-b7cb05c710a8"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Defense Evasion"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1218
          name: System Binary Proxy Execution
          reference: "https://attack.mitre.org/techniques/T1218/"
          subtechnique:
            - id: T1218.007
              name: Msiexec
              reference: "https://attack.mitre.org/techniques/T1218/007/"
  timestamp_override: event.ingested
  type: eql
  version: 1
