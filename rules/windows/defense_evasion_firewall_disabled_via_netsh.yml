id: f34e04b7-b970-5fa7-adcc-27b71173045d_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies netsh turning off the Windows firewall for one or all profiles.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: Windows Firewall Disabled via Netsh
  note: |
    ## Triage and analysis

    ### Investigating Windows Firewall Disabled via Netsh

    ### Possible investigation steps

    - Turn the firewall back on.
    - Check for new inbound connections after the change.

    ### False positive analysis

    - Lab and test machines. Exclude them by `host.name`.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.name : "netsh.exe" and process.args : ("advfirewall", "firewall") and
      process.args : "state" and process.args : "off"
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: f34e04b7-b970-5fa7-adcc-27b71173045d
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Defense Evasion"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1562
          name: Impair Defenses
          reference: "https://attack.mitre.org/techniques/T1562/"
          subtechnique:
            - id: T1562.004
              name: Disable or Modify System Firewall
              reference: "https://attack.mitre.org/techniques/T1562/004/"
  timestamp_override: event.ingested
  type: eql
  version: 1
