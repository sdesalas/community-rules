id: ca3a445f-fcb0-5416-992c-54bb2ed80542_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies tools exporting the DPAPI domain backup key. With it, an attacker can decrypt saved browser and app secrets of every domain user.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "winlogbeat-*"
    - "logs-windows.sysmon_operational-*"
  language: eql
  license: Elastic License v2
  name: DPAPI Domain Backup Key Export Attempt
  note: |
    ## Triage and analysis

    ### Investigating DPAPI Domain Backup Key Export Attempt

    ### Possible investigation steps

    - Identify the account that ran it and where it logged on from.
    - Treat all DPAPI-protected secrets in the domain as exposed.

    ### False positive analysis

    - None expected.
  query: |
    process where host.os.type == "windows" and event.type == "start" and
      process.command_line : ("*lsadump::backupkeys*", "*SharpDPAPI*backupkey*", "*dpapi::masterkey*/rpc*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 73
  rule_id: ca3a445f-fcb0-5416-992c-54bb2ed80542
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: high
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
  timestamp_override: event.ingested
  type: eql
  version: 1
