id: "81ff1bff-e8a5-43b8-8bdb-3988bcc8863f_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies a shell that downloads a script with curl or wget and pipes it straight into another shell. This runs remote code without leaving a file to inspect.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "auditbeat-*"
  language: eql
  license: Elastic License v2
  name: Remote Script Downloaded and Piped to a Shell
  note: |
    ## Triage and analysis

    ### Investigating Remote Script Downloaded and Piped to a Shell

    ### Possible investigation steps

    - Fetch the URL in `process.command_line` from an isolated environment and read the script.
    - Review the parent process and the user that ran the command.
    - Look for files, services or cron entries created after the command ran.

    ### False positive analysis

    - Installers for developer tools often use this pattern. Exclude the known URLs once confirmed.
  query: |
    process where host.os.type in ("linux", "macos") and event.type == "start" and
      event.action in ("exec", "exec_event", "start", "ProcessRollup2", "executed", "process_started") and
      process.name in ("bash", "sh", "zsh", "dash") and process.args == "-c" and
      process.command_line like ("*curl *| *sh*", "*curl *| *bash*", "*wget *| *sh*", "*wget *| *bash*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "81ff1bff-e8a5-43b8-8bdb-3988bcc8863f"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Command and Control"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: "MITRE ATT&CK"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
      technique:
        - id: T1105
          name: Ingress Tool Transfer
          reference: "https://attack.mitre.org/techniques/T1105/"
  timestamp_override: event.ingested
  type: eql
  version: 1
