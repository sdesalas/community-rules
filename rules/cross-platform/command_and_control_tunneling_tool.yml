id: "6da597d0-a598-53df-a0d8-b25a7d08e5c5_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies ngrok, chisel, frp, cloudflared or bore starting a tunnel, which exposes an internal service to the internet or opens a path into the network.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
  language: eql
  license: Elastic License v2
  name: Tunneling Tool Started
  note: |
    ## Triage and analysis

    ### Investigating Tunneling Tool Started

    ### Possible investigation steps

    - Review what local port the tunnel exposes.
    - Identify the account that started it.

    ### False positive analysis

    - Developers share local apps with ngrok. Confirm against your policy.
  query: |
    process where event.type == "start" and
      (process.name : ("ngrok", "ngrok.exe", "chisel", "chisel.exe", "frpc", "frpc.exe", "bore", "bore.exe") or
        (process.name : ("cloudflared", "cloudflared.exe") and process.args : "tunnel"))
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "6da597d0-a598-53df-a0d8-b25a7d08e5c5"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Command and Control"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
      technique:
        - id: T1572
          name: Protocol Tunneling
          reference: "https://attack.mitre.org/techniques/T1572/"
  timestamp_override: event.ingested
  type: eql
  version: 1
