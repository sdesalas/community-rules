id: "7d322275-8fe3-535a-a66e-4d5f15ac4dd9_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies a script interpreter or file utility reading an SSH private key, the first time for that host and process in 14 days.
  from: now-9m
  history_window_start: now-14d
  index:
    - "logs-endpoint.events.process*"
  language: kuery
  license: Elastic License v2
  name: SSH Private Key Read by a Scripting Tool
  new_terms_fields:
    - host.id
    - process.name
  note: |
    ## Triage and analysis

    ### Investigating SSH Private Key Read by a Scripting Tool

    ### Possible investigation steps

    - Check where the key was copied or sent.
    - Rotate the key if the read was not expected.

    ### False positive analysis

    - Users copying their own keys to a new machine. Confirm with the user.
  query: |
    event.category:process and event.type:start and
      process.name:(cat or cp or scp or base64 or python or python3 or perl or ruby or node) and
      process.args:*/.ssh/id_* and not process.args:*.pub
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
  risk_score: 47
  rule_id: "7d322275-8fe3-535a-a66e-4d5f15ac4dd9"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Windows"
    - "OS: Linux"
    - "OS: macOS"
    - "Use Case: Threat Detection"
    - "Tactic: Credential Access"
    - "Data Source: Elastic Defend"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.004
              name: Private Keys
              reference: "https://attack.mitre.org/techniques/T1552/004/"
  timestamp_override: event.ingested
  type: new_terms
  version: 1
